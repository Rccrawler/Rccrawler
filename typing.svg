<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 60" width="650" height="60">
    <rect width="100%" height="100%" fill="#000" />
    <style>
        .text { 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold; 
            font-size: 32px; 
            fill: #00FF00;
        }
    </style>
    <defs>
        <clipPath id="clip">
            <rect x="0" y="0" width="0" height="60">
                <animate 
                    attributeName="width" 
                    dur="16s" 
                    repeatCount="indefinite"
                    calcMode="discrete"
                    values="0;30;60;90;120;150;180;210;240;270;300;330;360;390;420;450;450;450;0;30;60;90;120;150;180;210;240;270;300;330;360;360;360;360;360;360;0;30;60;90;120;150;180;210;240;270;300;330;360;390;420;450;450;450;0;30;60;90;120;150;180;210;240;270;300;330;360;390;420;450;480;510"
                />
            </rect>
        </clipPath>
    </defs>
    <g clip-path="url(#clip)">
        <text x="10" y="40" class="text">
            <tspan x="10">full stack developer<animate attributeName="visibility" values="visible;visible;hidden;hidden;hidden;hidden;hidden;hidden" dur="16s" repeatCount="indefinite" /></tspan>
            <tspan x="10">systems inventor<animate attributeName="visibility" values="hidden;hidden;visible;visible;hidden;hidden;hidden;hidden" dur="16s" repeatCount="indefinite" /></tspan>
            <tspan x="10">robotics enthusiast<animate attributeName="visibility" values="hidden;hidden;hidden;hidden;visible;visible;hidden;hidden" dur="16s" repeatCount="indefinite" /></tspan>
            <tspan x="10">Project IDX contributor<animate attributeName="visibility" values="hidden;hidden;hidden;hidden;hidden;hidden;visible;visible" dur="16s" repeatCount="indefinite" /></tspan>
        </text>
    </g>
    <rect x="10" y="10" width="20" height="35" fill="#00FF00">
        <animate 
            attributeName="x" 
            dur="16s" 
            repeatCount="indefinite"
            calcMode="discrete"
            values="10;40;70;100;130;160;190;220;250;280;310;340;370;400;430;460;460;460;10;40;70;100;130;160;190;220;250;280;310;340;370;370;370;370;370;370;10;40;70;100;130;160;190;220;250;280;310;340;370;400;430;460;460;460;10;40;70;100;130;160;190;220;250;280;310;340;370;400;430;460;490;520"
        />
        <animate attributeName="visibility" values="visible;hidden" dur="0.8s" repeatCount="indefinite" />
    </rect>
</svg>